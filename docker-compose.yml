version: '3.8'

services:
  vestly:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vestly-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=${JWT_SECRET:-vestly_default_production_jwt_secret_change_me_32chars}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-vestly_nextauth_secret_key_change_in_production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
    volumes:
      - vestly-data:/app/prisma
      - vestly-uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  vestly-data:
    driver: local
  vestly-uploads:
    driver: local
